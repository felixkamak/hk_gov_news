name: Social Media Content Scraper

on:
  schedule:
    - cron: '0 21 * * 0,2,4'  # Mon/Wed/Fri 5am HKT (UTC+8, trigger Sun/Tue/Thu 21:00 UTC)
  workflow_dispatch:  # Keep manual trigger for testing

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run social media scraper
        run: |
          cd social_media_scraper
          python main.py

      - name: Generate visual assets
        run: |
          cd social_media_scraper
          python image_generator.py

      - name: Commit output to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add social_media_scraper/output/
          git diff --staged --quiet || git commit -m "Auto: social media scraper $(date '+%Y-%m-%d')"
          git push
