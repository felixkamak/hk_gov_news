name: Social Media Content Scraper

on:
  schedule:
    - cron: '0 21 * * *'  # Daily 5am HKT (21:00 UTC previous day)
  workflow_dispatch:  # Keep manual trigger for testing
  push:
    branches:
      - 'scraper-test/**'  # Test runs: push to a scraper-test/* branch to run without publishing

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run social media scraper
        run: |
          cd social_media_scraper
          python main.py

      - name: Generate visual assets
        run: |
          cd social_media_scraper
          python image_generator.py

      - name: Upload output for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-output
          path: social_media_scraper/output/
          retention-days: 7

      - name: Commit output and trigger Vercel rebuild
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add social_media_scraper/output/
          if git diff --staged --quiet; then
            echo "No changes in scraper output — skipping commit and rebuild."
          else
            git commit -m "Auto: social media scraper $(date '+%Y-%m-%d')"
            git push
            echo "Output updated — triggering Vercel rebuild."
            curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
          fi
